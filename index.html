<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ohPDF Reader</title>
  <link rel="stylesheet" href="src/reader.css" />
</head>
<body>
  <div class="app">
    <!-- Ribbon 工具栏 -->
    <header class="ribbon">
      <div class="ribbon-group">
        <button id="openBtn" class="rbtn rbtn-primary" title="打开 PDF (Ctrl/Cmd+O)">
          <svg viewBox="0 0 20 20" fill="none"><path d="M3 6.5C3 5.67 3.67 5 4.5 5H8l1.5 2H15.5c.83 0 1.5.67 1.5 1.5v6c0 .83-.67 1.5-1.5 1.5h-11C3.67 16 3 15.33 3 14.5v-8Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <span>打开</span>
        </button>
      </div>

      <div class="ribbon-divider"></div>

      <div class="ribbon-group">
        <button id="undoBtn" class="rbtn" title="撤销 (Ctrl/Cmd+Z)">
          <svg viewBox="0 0 20 20" fill="none"><path d="M6 6H14.5C16.43 6 18 7.57 18 9.5C18 11.43 16.43 13 14.5 13H9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M8.5 3.5L5 6L8.5 8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>撤销</span>
        </button>
        <button id="saveBtn" class="rbtn" title="保存标注 (Ctrl/Cmd+S)">
          <svg viewBox="0 0 20 20" fill="none"><path d="M4 4.5C4 3.67 4.67 3 5.5 3H13L16 6V15.5C16 16.33 15.33 17 14.5 17H5.5C4.67 17 4 16.33 4 15.5V4.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M7 3V7H13V3" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M7 17V12H13V17" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>保存</span>
          <i id="dirtyDot" class="dirty-dot"></i>
        </button>
      </div>

      <div class="ribbon-divider"></div>

      <div class="ribbon-group" id="toolGroup">
        <button class="rbtn tool-btn active" data-mode="pan" title="浏览模式">
          <svg viewBox="0 0 20 20" fill="none"><path d="M6 3.5L15 10L11 11L13.5 15.5L11.5 16.5L9 12L6 15V3.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          <span>浏览</span>
        </button>
        <button class="rbtn tool-btn" data-mode="highlight" title="高亮">
          <svg viewBox="0 0 20 20" fill="none"><path d="M11.5 3.5L16.5 8.5L8.5 16.5H3.5V11.5L11.5 3.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M9.5 5.5L14.5 10.5" stroke="currentColor" stroke-width="1.3"/></svg>
          <span>高亮</span>
        </button>
        <button class="rbtn tool-btn" data-mode="note" title="便签">
          <svg viewBox="0 0 20 20" fill="none"><path d="M4 4.5C4 3.67 4.67 3 5.5 3H14.5C15.33 3 16 3.67 16 4.5V12L12.5 15.5H5.5C4.67 15.5 4 14.83 4 14V4.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M12.5 15.5V12H16" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          <span>便签</span>
        </button>
        <button class="rbtn tool-btn" data-mode="ink" title="画线">
          <svg viewBox="0 0 20 20" fill="none"><path d="M4 14.5C6 14.5 6 10.5 8 10.5C10 10.5 10 15 12 15C14 15 14 6.5 16 6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span>画线</span>
        </button>
        <label class="color-swatch" title="标注颜色">
          <input type="color" id="colorPicker" value="#f2c40c" />
        </label>
      </div>

      <div class="ribbon-spacer"></div>

      <div class="ribbon-group ribbon-meta">
        <span id="docTitle" class="doc-title">未打开文件</span>
      </div>
    </header>

    <!-- 阅读区 -->
    <main class="stage">
      <div id="emptyState" class="empty-state">
        <svg viewBox="0 0 64 64" fill="none" width="56" height="56"><path d="M16 8C16 5.79 17.79 4 20 4H38L48 14V56C48 58.21 46.21 60 44 60H20C17.79 60 16 58.21 16 56V8Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M38 4V14H48" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <p>打开一个 PDF 文件开始阅读与标注</p>
        <button id="emptyOpenBtn" class="rbtn rbtn-primary">选择 PDF 文件</button>
      </div>

      <div id="pageWrap" class="page-wrap" hidden>
        <div class="page-shadow">
          <canvas id="pageCanvas"></canvas>
          <canvas id="annotCanvas"></canvas>
        </div>
      </div>

      <!-- 便签输入弹层 -->
      <div id="notePopup" class="note-popup">
        <input id="notePopupInput" type="text" placeholder="输入便签内容…" />
        <button id="notePopupOk" title="确认">
          <svg viewBox="0 0 20 20" fill="none"><path d="M4 10.5L8 14.5L16 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="notePopupCancel" title="取消">
          <svg viewBox="0 0 20 20" fill="none"><path d="M5 5L15 15M15 5L5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </main>

    <!-- 底部状态栏：翻页 + 缩放 -->
    <footer class="statusbar">
      <div class="page-nav">
        <button id="prevBtn" class="ibtn" title="上一页 (←)">
          <svg viewBox="0 0 20 20" fill="none"><path d="M12.5 4L7 10L12.5 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="page-indicator">
          <input id="pageNum" type="text" inputmode="numeric" value="0" />
          <span class="page-sep">/</span>
          <span id="pageTotal">0</span>
        </span>
        <button id="nextBtn" class="ibtn" title="下一页 (→)">
          <svg viewBox="0 0 20 20" fill="none"><path d="M7.5 4L13 10L7.5 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="zoom-control">
        <input id="zoom" type="range" min="50" max="300" step="10" value="100" />
        <span id="zoomLabel">100%</span>
      </div>
    </footer>
  </div>

  <script type="module" src="src/reader.js"></script>
</body>
</html>
