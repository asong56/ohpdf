name: Build & Release OhPDF

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-amd64
            os: ubuntu-latest
            artifact_name: ohpdf
            asset_name: ohpdf-linux-amd64
          - name: macos-arm64
            os: macos-latest
            artifact_name: ohpdf
            asset_name: ohpdf-macos-arm64
          - name: windows-amd64
            os: windows-latest
            artifact_name: ohpdf.exe
            asset_name: ohpdf-windows-amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            pkg-config

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        # Vendored MuPDF build needs clang (Xcode command line tools, already
        # present on GitHub's macOS runners); no Homebrew `mupdf` package is
        # required or used.
        run: |
          xcode-select --install || true

      - name: Build release binary
        run: cargo build --release

      - name: Package into ZIP (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.platform.artifact_name }}" dist/

          cd dist
          zip -r "../${{ matrix.platform.asset_name }}.zip" .

      - name: Package into ZIP (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Windows runners don't ship a `zip` binary, so use PowerShell's
        # built-in Compress-Archive instead.
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/release/${{ matrix.platform.artifact_name }}" dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.platform.asset_name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.asset_name }}
          path: ${{ matrix.platform.asset_name }}.zip
          retention-days: 15

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display downloaded files
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ohpdf-linux-amd64/ohpdf-linux-amd64.zip
            artifacts/ohpdf-macos-arm64/ohpdf-macos-arm64.zip
            artifacts/ohpdf-windows-amd64/ohpdf-windows-amd64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
