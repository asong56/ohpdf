[workspace]
members = ["ohpdf-core", "ohpdf-desktop", "ohpdf-cli"]
resolver = "2"

[workspace.dependencies]
mupdf      = { version = "0.8", default-features = false, features = ["img", "base14-fonts", "system-fonts"] }
anyhow     = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
log        = "0.4"
tempfile   = "3"
tao        = "0.30"
wry        = "0.46"
dirs       = "5"
rfd        = "0.14"
base64     = "0.22"
env_logger = "0.11"
