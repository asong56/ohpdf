[package]
name = "ohpdf"
version = "0.1.0"
edition = "2021"
authors = ["OhPDF Contributors"]
description = "A PDF tool that lives on your computer. No upload. No account. Just PDF."
license = "MIT"
repository = "https://github.com/yourusername/ohpdf"
readme = "README.md"
keywords = ["pdf", "desktop", "local", "tools"]

[[bin]]
name = "ohpdf"
path = "src/main.rs"

[dependencies]
tao = "0.30"
wry = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# NOTE: bumped from "0.4" -> "0.8": 0.4's public API in this repo (WriteOptions,
# Permissions, Document::copy_page_from/rotate_page/add_page, Color, ...) does not
# exist in the published crate at all; 0.8 is the current release. Pages are
# copied between documents via PdfDocument::find_page + PdfGraftMap::graft_object
# (see src/pdf/pdf_ops.rs), following MuPDF's own documented "copyPage" recipe —
# not via any built-in "insert_pdf" helper, which does not exist in this crate.
#
# default-features disabled on purpose: upstream's defaults statically link a
# JS engine (mujs, for interactive form scripts), Tesseract OCR, and XPS/SVG/
# CBZ/HTML/EPUB/DOCX-output/Brotli support on top of the core PDF reader/
# writer. None of that is reachable from this codebase — grep every `use
# mupdf::` in src/ and the only things imported are PdfDocument/PdfGraftMap/
# PdfObject/PdfWriteOptions/Encryption/Permission (core PDF read-write and
# standard PDF encryption, not gated behind any of those features) and
# Document/Image/Colorspace/ImageFormat/InsertImageOptions/Matrix/
# PageImageSource/Rect/Size (rendering + image insert). "img" is kept because
# images.rs decodes standalone PNG/JPG/WEBP/BMP files via Image::from_file for
# the images-to-pdf tool. If a future feature needs OCR, forms/JS, or another
# document format, add that feature back deliberately rather than reverting to
# the full default set.
mupdf = { version = "0.8", default-features = false, features = ["img"] }
tempfile = "3"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
# Native "open file" dialog. The previous code assumed browser `File` objects
# expose a `.path` property, which no webview (WebView2 / WKWebView / WebKitGTK)
# actually provides for security reasons. rfd gives us a real OS file dialog
# from Rust, so we always get a real absolute path.
rfd = "0.14"
base64 = "0.22"
dirs = "5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# NOTE: deliberately NOT setting panic = "abort" here. src/ipc.rs wraps every
# PDF operation in catch_unwind so a panic from a malformed/corrupt PDF turns
# into a normal error response to the UI instead of taking the whole app
# down (see the comment there). panic = "abort" would silently defeat that
# safety net for a small, unmeasured size saving — not worth it.

[profile.dev]
opt-level = 0
debug = true
