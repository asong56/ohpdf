<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ohpdf</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<main id="app">

  <!-- ── Global drop overlay ───────────────────────────────────────── -->
  <aside id="drop-overlay">
    <span class="drop-icon">▭</span>
    <span class="drop-text">Drop files anywhere</span>
  </aside>

  <!-- ── Home + Task panel ─────────────────────────────────────────── -->
  <section id="main">

    <section id="home">
      <section id="reading-entry-slot"></section>
      <section class="grid" id="tool-grid"></section>
    </section>

    <section id="task-view">
      <button class="back-btn" id="back-btn">← Back</button>
      <h1 class="task-title" id="task-title"></h1>
      <section id="task-body"></section>
    </section>

  </section>

  <!-- ── Reader view ───────────────────────────────────────────────── -->
  <section id="reader-view">

    <header class="reader-toolbar">
      <button class="reader-btn back-btn" id="reader-back-btn" title="Back">
        <!-- Phosphor: ArrowLeft -->
        <svg viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"/></svg>
      </button>

      <span class="reader-toolbar-divider"></span>

      <nav class="reader-toolbar-controls" id="reader-controls">

        <!-- Open file -->
        <button class="reader-btn" id="reader-open-btn" title="Open PDF (Ctrl+O)">
          <!-- Phosphor: FolderOpen -->
          <svg viewBox="0 0 256 256" fill="currentColor"><path d="M245,110.64A16,16,0,0,0,232,104H216V88a16,16,0,0,0-16-16H130.67L102.94,51.2A16.14,16.14,0,0,0,92.69,48H40A16,16,0,0,0,24,64V200h0a8,8,0,0,0,8,8H211.1a8,8,0,0,0,7.59-5.47l28.49-85.47A16,16,0,0,0,245,110.64ZM92.69,64l27.73,20.8a16.14,16.14,0,0,0,10.25,3.2H200v16H72a16,16,0,0,0-15.14,10.84L40,163.79V64ZM213,200H43.1l26.67-80H232Z"/></svg>
        </button>

        <span class="reader-toolbar-divider"></span>

        <!-- Save annotations -->
        <button class="reader-btn" id="reader-save-btn" title="Save annotations (Ctrl+S)">
          <span class="dirty-dot"></span>
          <!-- Phosphor: FloppyDisk -->
          <svg viewBox="0 0 256 256" fill="currentColor"><path d="M219.31,72,184,36.69A15.86,15.86,0,0,0,172.69,32H48A16,16,0,0,0,32,48V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V83.31A15.86,15.86,0,0,0,219.31,72ZM168,208H88V152h80Zm40,0H184V152a16,16,0,0,0-16-16H88a16,16,0,0,0-16,16v56H48V48H172.69L208,83.31ZM160,72a8,8,0,0,1-8,8H96a8,8,0,0,1,0-16h56A8,8,0,0,1,160,72Z"/></svg>
        </button>

        <!-- Undo -->
        <button class="reader-btn" id="reader-undo-btn" title="Undo last annotation (Ctrl+Z)">
          <!-- Phosphor: ArrowCounterClockwise -->
          <svg viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a96,96,0,1,1-96-96A96.11,96.11,0,0,1,224,128Zm-96,80a80,80,0,1,0-80-80A80.09,80.09,0,0,0,128,208Zm-8-120v88a8,8,0,0,1-16,0V95.31L81.66,117.66A8,8,0,0,1,70.34,106.34l40-40a8,8,0,0,1,11.32,0l40,40a8,8,0,0,1-11.32,11.32Z"/></svg>
        </button>

        <span class="reader-toolbar-divider"></span>

        <!-- Mode group -->
        <nav id="reader-mode-group">
          <button class="reader-btn" data-mode="pan" title="Pan / select mode">
            <!-- Phosphor: Hand -->
            <svg viewBox="0 0 256 256" fill="currentColor"><path d="M186,96a26,26,0,0,0-20.08,9.47,26,26,0,0,0-37.33-3.23V72a26,26,0,0,0-52,0v60.37l-5.71-9.29A26,26,0,0,0,26.3,139.26L69.05,212.51A79.74,79.74,0,0,0,138.26,250H144a80.09,80.09,0,0,0,80-80V122A26,26,0,0,0,186,96Zm10,74a64.07,64.07,0,0,1-64,64h-5.74a63.78,63.78,0,0,1-55.41-32.22L27.3,128.51a10,10,0,0,1,17.33-10L63,149.86A8,8,0,0,0,76.92,146V72a10,10,0,0,1,20,0v56a8,8,0,0,0,16,0V108a10,10,0,0,1,20,0v16a8,8,0,0,0,16,0v-2a10,10,0,0,1,20,0Z"/></svg>
          </button>
          <button class="reader-btn" data-mode="highlight" title="Highlight">
            <!-- Phosphor: Highlighter -->
            <svg viewBox="0 0 256 256" fill="currentColor"><path d="M248,40a8,8,0,0,0-8-8H16a8,8,0,0,0,0,16H240A8,8,0,0,0,248,40Zm-24,40H32a8,8,0,0,0-8,8v80a8,8,0,0,0,8,8h8v32a8,8,0,0,0,16,0V176h16v32a8,8,0,0,0,16,0V176h16v32a8,8,0,0,0,16,0V176h16v32a8,8,0,0,0,16,0V176h8a8,8,0,0,0,8-8V88A8,8,0,0,0,224,80Zm-8,80H40V96H216Z"/></svg>
          </button>
          <button class="reader-btn" data-mode="note" title="Sticky note">
            <!-- Phosphor: StickyNote -->
            <svg viewBox="0 0 256 256" fill="currentColor"><path d="M224,56V168.69a15.86,15.86,0,0,1-4.69,11.31L168.69,230.62A15.86,15.86,0,0,1,157.38,235H32A16,16,0,0,1,16,219V56A16,16,0,0,1,32,40H208A16,16,0,0,1,224,56ZM157.38,219h0L208,168.69h-42.7A8,8,0,0,0,157.38,176h0Zm50.62-163H32V219H141.38V176a24,24,0,0,1,24-24H208Z"/></svg>
          </button>
          <button class="reader-btn" data-mode="ink" title="Draw / ink">
            <!-- Phosphor: PencilSimple -->
            <svg viewBox="0 0 256 256" fill="currentColor"><path d="M227.31,73.37,182.63,28.68a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H216a8,8,0,0,0,0-16H115.32l112-112A16,16,0,0,0,227.31,73.37ZM92.69,208H48V163.31l88-88,44.68,44.69ZM192,108.68,147.32,64l24-24L216,84.68Z"/></svg>
          </button>
        </nav>

        <!-- Color swatch -->
        <label class="reader-color-swatch" title="Annotation colour">
          <span id="reader-color-swatch" style="position:absolute;inset:0;border-radius:50%;background:#f2c40c;"></span>
          <input type="color" id="reader-color" value="#f2c40c" />
        </label>

      </nav>

      <span class="reader-toolbar-spacer"></span>
      <span class="reader-doc-title" id="reader-doc-title"></span>
    </header>

    <!-- Page canvas stage -->
    <section class="reader-stage" id="reader-stage">

      <!-- Shown when no document is open -->
      <article class="reader-empty" id="reader-empty">
        <span class="re-icon">
          <!-- Phosphor: FilePdf -->
          <svg viewBox="0 0 256 256" fill="currentColor"><path d="M224,152a8,8,0,0,1-8,8H192v16h16a8,8,0,0,1,0,16H192v16a8,8,0,0,1-16,0V152a8,8,0,0,1,8-8h32A8,8,0,0,1,224,152ZM92,172a28,28,0,0,1-28,28H56v8a8,8,0,0,1-16,0V152a8,8,0,0,1,8-8H64A28,28,0,0,1,92,172Zm-16,0a12,12,0,0,0-12-12H56v24h8A12,12,0,0,0,76,172Zm88,8a36,36,0,0,1-36,36H112a8,8,0,0,1-8-8V152a8,8,0,0,1,8-8h16A36,36,0,0,1,164,180Zm-16,0a20,20,0,0,0-20-20h-8v40h8A20,20,0,0,0,148,180ZM40,112V40A16,16,0,0,1,56,24h96a8,8,0,0,1,5.66,2.34l56,56A8,8,0,0,1,216,88v24a8,8,0,0,1-16,0V96H152a8,8,0,0,1-8-8V40H56v72a8,8,0,0,1-16,0ZM160,80h28.69L160,51.31Z"/></svg>
        </span>
        <p>Open a PDF to read and annotate it.<br/>Marks are saved alongside the file.</p>
        <button class="btn-primary reader-empty-btn" id="reader-empty-open-btn">Open PDF…</button>
      </article>

      <article class="reader-page-wrap" id="reader-page-wrap">
        <figure class="reader-page-shadow">
          <canvas id="reader-page-canvas"></canvas>
          <canvas id="reader-annot-canvas"></canvas>
        </figure>
      </article>

    </section>

    <!-- Status bar: prev / page input / next / zoom -->
    <footer class="reader-statusbar" id="reader-statusbar">
      <nav class="reader-page-nav">
        <button class="reader-icon-btn" id="reader-prev-btn" disabled>
          <!-- Phosphor: CaretLeft -->
          <svg viewBox="0 0 256 256" width="14" height="14" fill="currentColor"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"/></svg>
        </button>
        <span class="reader-page-indicator">
          <input type="number" id="reader-page-num" value="1" min="1" />
          <span style="color:#555">/</span>
          <span id="reader-page-total">—</span>
        </span>
        <button class="reader-icon-btn" id="reader-next-btn" disabled>
          <!-- Phosphor: CaretRight -->
          <svg viewBox="0 0 256 256" width="14" height="14" fill="currentColor"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"/></svg>
        </button>
      </nav>

      <span class="reader-toolbar-divider"></span>

      <span class="reader-zoom">
        <input type="range" id="reader-zoom" min="50" max="300" value="100" step="10" />
        <span class="reader-zoom-label" id="reader-zoom-label">100%</span>
      </span>
    </footer>

    <!-- Floating note popup -->
    <aside class="reader-note-popup" id="reader-note-popup">
      <textarea id="reader-note-input" placeholder="Type a note…" rows="3"></textarea>
      <span class="reader-note-actions">
        <button id="reader-note-delete" title="Delete note">
          <!-- Phosphor: Trash -->
          <svg viewBox="0 0 256 256" fill="currentColor"><path d="M216,48H176V40a24,24,0,0,0-24-24H104A24,24,0,0,0,80,40v8H40a8,8,0,0,0,0,16h8V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64h8a8,8,0,0,0,0-16ZM96,40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8v8H96Zm96,168H64V64H192ZM112,104v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm48,0v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Z"/></svg>
        </button>
        <span class="spacer"></span>
        <button id="reader-note-cancel" title="Cancel">
          <!-- Phosphor: X -->
          <svg viewBox="0 0 256 256" fill="currentColor"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg>
        </button>
        <button id="reader-note-ok" title="Save (Ctrl+Enter)">
          <!-- Phosphor: Check -->
          <svg viewBox="0 0 256 256" fill="currentColor"><path d="M173.66,98.34a8,8,0,0,1,0,11.32l-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35A8,8,0,0,1,173.66,98.34ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"/></svg>
        </button>
      </span>
    </aside>

  </section>

  <!-- ── Toast ─────────────────────────────────────────────────────── -->
  <output id="toast" role="status">
    <span class="toast-icon"></span>
    <span id="toast-msg"></span>
  </output>

</main>

<script src="scripts.js"></script>
</body>
</html>
